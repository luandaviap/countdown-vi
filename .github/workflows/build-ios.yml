name: Build iOS (Unsigned IPA)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Select Xcode Version
        run: |
          # Pinned to Xcode 16.4 (iphoneos18.5 SDK), the newest 16.x on macos-15.
          # Xcode 16.2 is installed but its asset catalog compile (actool) fails
          # there: no iOS 18.2 simulator runtime on the image.
          # Never use Xcode 26.x: it would switch to the iOS 26 SDK.
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app
          XCODE_APP=/Applications/Xcode_16.4.app
          if [ ! -d "$XCODE_APP" ]; then
            echo "Error: $XCODE_APP not installed on this runner image"
            exit 1
          fi
          echo "Selecting: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate
          cd ..
          if [ ! -d "ios/CountdownVI.xcodeproj" ]; then
            echo "Error: ios/CountdownVI.xcodeproj was not generated"
            exit 1
          fi

      - name: Build Archive (Unsigned)
        run: |
          mkdir -p build
          xcodebuild -project ios/CountdownVI.xcodeproj \
            -scheme CountdownVI \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/CountdownVI.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Package Payload and Create Unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/CountdownVI.xcarchive/Products/Applications/CountdownVI.app build/ipa/Payload/
          
          echo "Verifying app bundle contents..."
          ls -la build/ipa/Payload/CountdownVI.app
          
          if [ ! -d "build/ipa/Payload/CountdownVI.app/PlugIns/CountdownVIWidget.appex" ]; then
            echo "Error: PlugIns/CountdownVIWidget.appex missing inside CountdownVI.app"
            exit 1
          fi
          
          echo "PlugIns/CountdownVIWidget.appex verified successfully."
          
          cd build/ipa
          zip -r -y ../CountdownVI-unsigned.ipa Payload
          cd ../..
          
          ls -lh build/CountdownVI-unsigned.ipa

          echo "Toolchain recorded in the IPA:"
          APP_PLIST=build/ipa/Payload/CountdownVI.app/Info.plist
          for key in CFBundleVersion CFBundleShortVersionString DTXcode DTSDKName; do
            echo "$key = $(/usr/libexec/PlistBuddy -c "Print :$key" "$APP_PLIST")"
          done

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: CountdownVI-unsigned-build-${{ github.run_number }}
          path: build/CountdownVI-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: build/CountdownVI-unsigned.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
