name: Build iOS (Unsigned IPA)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate
          cd ..
          if [ ! -d "ios/CountdownVI.xcodeproj" ]; then
            echo "Error: ios/CountdownVI.xcodeproj was not generated"
            exit 1
          fi

      - name: Build Archive (Unsigned)
        run: |
          mkdir -p build
          xcodebuild -project ios/CountdownVI.xcodeproj \
            -scheme CountdownVI \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/CountdownVI.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Package Payload and Create Unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/CountdownVI.xcarchive/Products/Applications/CountdownVI.app build/ipa/Payload/
          
          echo "Verifying app bundle contents..."
          ls -la build/ipa/Payload/CountdownVI.app
          
          if [ ! -d "build/ipa/Payload/CountdownVI.app/PlugIns/CountdownVIWidget.appex" ]; then
            echo "Error: PlugIns/CountdownVIWidget.appex missing inside CountdownVI.app"
            exit 1
          fi
          
          echo "PlugIns/CountdownVIWidget.appex verified successfully."
          
          cd build/ipa
          zip -r -y ../CountdownVI-unsigned.ipa Payload
          cd ../..
          
          ls -lh build/CountdownVI-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CountdownVI-unsigned-build-${{ github.run_number }}
          path: build/CountdownVI-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/CountdownVI-unsigned.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
